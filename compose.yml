services:

  fastapi:
    build: .
    image: mt-evaluate

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: unless-stopped

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_mt_evaluate_rules.rules:/etc/prometheus/prometheus_mt_evaluate_rules.rules

    restart: unless-stopped


  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


volumes:
  grafana-storage: